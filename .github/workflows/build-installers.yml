name: Build installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows .exe (NSIS)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --no-audit --no-fund

      # electron-builder signs Seas AI.exe and the NSIS installer automatically when
      # CSC_LINK (base64 .pfx, or a URL to it) and CSC_KEY_PASSWORD are set as repo secrets.
      # Without them the build still succeeds — it is just unsigned.
      - name: Build installer
        run: npm run dist:win
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Report Authenticode status
        shell: pwsh
        continue-on-error: true
        run: |
          $rows = @('| File | Status | Signer |', '| --- | --- | --- |')
          $unsigned = $false
          foreach ($exe in Get-ChildItem dist/*.exe) {
            $sig = Get-AuthenticodeSignature $exe.FullName
            if ($sig.Status -ne 'Valid') { $unsigned = $true }
            $signer = if ($sig.SignerCertificate) { $sig.SignerCertificate.Subject } else { '(none)' }
            $rows += "| $($exe.Name) | $($sig.Status) | $signer |"
          }
          $rows | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ($unsigned) {
            Add-Content $env:GITHUB_STEP_SUMMARY '**Unsigned installer** — Windows 11 Smart App Control will block it (see README).'
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*.exe
          if-no-files-found: error

  linux:
    name: Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --no-audit --no-fund

      - run: npm run dist:linux

      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: dist/*.AppImage
          if-no-files-found: error

  release:
    name: Attach installers to release
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.AppImage
          generate_release_notes: true
